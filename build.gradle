plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ouyabrowser'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ouyabrowser'
        minSdk 16
        targetSdk 28
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
